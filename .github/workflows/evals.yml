name: proactive evals

on:
  schedule:
    - cron: "17 15 * * 1"
  workflow_dispatch:
    inputs:
      model:
        description: OpenCode Go model ID override
        type: string
        required: false

permissions:
  contents: read

jobs:
  proactive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm eval:proactive
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          MIPI_EVAL_MODEL: ${{ inputs.model }}
