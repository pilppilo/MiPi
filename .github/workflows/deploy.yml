name: deploy

# Every push to main deploys to staging (`mipi-staging`) after `check` passes. Production (`mipi`) deploys only by
# hand: Actions → deploy → Run workflow → target: production. Every deploy backs up the target's agent first (when
# it has one) and keeps the backup as a workflow artifact for 30 days; restore.yml can put it back.
on:
  workflow_run:
    workflows: [check]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.target || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Each lane's secrets live in its GitHub Environment (repository secrets are the fallback). Auto-deploys from main
    # have no inputs, hence the default.
    environment: ${{ inputs.target || 'staging' }}
    env:
      TARGET: ${{ inputs.target || 'staging' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
      # Only while rotating a lane's ADMIN_TOKEN: the old value, which the running Worker still has.
      ADMIN_TOKEN_PREVIOUS: ${{ secrets.ADMIN_TOKEN_PREVIOUS }}
      # Cloudflare Access (M4): on once the lane's Environment has both variables. The service token gets the deploy
      # scripts through Access to the admin routes.
      ACCESS_TEAM_DOMAIN: ${{ vars.ACCESS_TEAM_DOMAIN }}
      ACCESS_AUD: ${{ vars.ACCESS_AUD }}
      ACCESS_OWNER_EMAIL: ${{ vars.ACCESS_OWNER_EMAIL }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Require the deploy secrets
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          MIPI_SPIKE_TOKEN: ${{ secrets.MIPI_SPIKE_TOKEN }}
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID OPENCODE_API_KEY MIPI_SPIKE_TOKEN ADMIN_TOKEN; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing (Settings → Environments → $TARGET, or repository secrets)"
            exit 1
          fi
          if [ -n "$ACCESS_TEAM_DOMAIN$ACCESS_AUD" ]; then
            for name in ACCESS_TEAM_DOMAIN ACCESS_AUD ACCESS_OWNER_EMAIL CF_ACCESS_CLIENT_ID CF_ACCESS_CLIENT_SECRET; do
              if [ -z "${!name}" ]; then
                echo "::error::Access is half set up: $name is missing (Environment $TARGET: variables ACCESS_TEAM_DOMAIN, ACCESS_AUD, ACCESS_OWNER_EMAIL; secrets CF_ACCESS_CLIENT_ID, CF_ACCESS_CLIENT_SECRET)"
                exit 1
              fi
            done
          fi
          for name in MIPI_SPIKE_TOKEN ADMIN_TOKEN; do
            value="${!name}"
            if [ "${#value}" -lt 24 ]; then
              echo "::error::$name is shorter than 24 characters; use a long random string"
              exit 1
            fi
          done

      - name: Worker URL
        run: |
          subdomain="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r .result.subdomain)"
          name="mipi"; [ "$TARGET" = staging ] && name="mipi-staging"
          echo "WORKER_URL=https://$name.$subdomain.workers.dev" >> "$GITHUB_ENV"

      - name: Back up the agent
        run: node scripts/deploy.ts backup --url "$WORKER_URL" --out "$RUNNER_TEMP/backup.json"
      - uses: actions/upload-artifact@v4
        with:
          name: backup-${{ env.TARGET }}-${{ github.run_id }}
          path: ${{ runner.temp }}/backup.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Build
        run: |
          if [ "$TARGET" = staging ]; then export CLOUDFLARE_ENV=staging; fi
          pnpm build

      - name: Deploy with secrets
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          MIPI_SPIKE_TOKEN: ${{ secrets.MIPI_SPIKE_TOKEN }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          secrets="$RUNNER_TEMP/worker-secrets.json"
          trap 'rm -f "$secrets"' EXIT
          umask 077
          jq -n --arg key "$OPENCODE_API_KEY" --arg spike "$MIPI_SPIKE_TOKEN" --arg admin "$ADMIN_TOKEN" \
            '{OPENCODE_API_KEY: $key, MIPI_SPIKE_TOKEN: $spike, ADMIN_TOKEN: $admin}' > "$secrets"
          # Secrets ship with the version itself, so no deployed version ever runs without its key.
          # Access settings ride with the version as vars (they're not secret); unset, Access stays off.
          access_vars=()
          if [ -n "$ACCESS_TEAM_DOMAIN" ] && [ -n "$ACCESS_AUD" ]; then
            access_vars=(--var "ACCESS_TEAM_DOMAIN:$ACCESS_TEAM_DOMAIN" --var "ACCESS_AUD:$ACCESS_AUD" --var "ACCESS_OWNER_EMAIL:$ACCESS_OWNER_EMAIL" \
              --var "ACCESS_SERVICE_CLIENT_ID:$CF_ACCESS_CLIENT_ID")
          fi
          pnpm exec wrangler deploy --secrets-file "$secrets" "${access_vars[@]}" \
            --message "$version (${GITHUB_SHA::7})" --tag "$version"

      - name: Health check
        # The deployed version, read through the admin API (with Access on, the public health check shows no version).
        run: |
          expected="$(node -p 'require("./package.json").version')"
          deployed=""
          for attempt in 1 2 3 4 5 6; do
            deployed="$(node scripts/deploy.ts version --url "$WORKER_URL" 2>/dev/null || true)"
            if [ "$deployed" = "$expected" ]; then
              echo "Healthy: $WORKER_URL runs $deployed"
              echo "### Deployed MiPi $expected to $TARGET: $WORKER_URL" >> "$GITHUB_STEP_SUMMARY"
              node scripts/deploy.ts status --url "$WORKER_URL" | jq '{state, build, rows}' >> "$GITHUB_STEP_SUMMARY" || true
              exit 0
            fi
            sleep 10
          done
          echo "::error::$WORKER_URL did not report version $expected through the admin API (last: ${deployed:-no answer})"
          exit 1
