name: deploy

# Every push to main deploys to staging (`mipi-staging`) after `check` passes. Production (`mipi`) deploys only by
# hand: Actions → deploy → Run workflow → target: production. Every deploy backs up the target's agent first (when
# it has one) and keeps the backup as a workflow artifact for 30 days; restore.yml can put it back.
on:
  workflow_run:
    workflows: [check]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.target || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Each lane's secrets live in its GitHub Environment (repository secrets are the fallback). Auto-deploys from main
    # have no inputs, hence the default.
    environment: ${{ inputs.target || 'staging' }}
    env:
      TARGET: ${{ inputs.target || 'staging' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
      # Only while rotating a lane's ADMIN_TOKEN: the old value, which the running Worker still has.
      ADMIN_TOKEN_PREVIOUS: ${{ secrets.ADMIN_TOKEN_PREVIOUS }}
      # Cloudflare Access (M4): on once the lane's Environment has both variables. The service token gets the deploy
      # scripts through Access to the admin routes.
      ACCESS_TEAM_DOMAIN: ${{ vars.ACCESS_TEAM_DOMAIN }}
      ACCESS_AUD: ${{ vars.ACCESS_AUD }}
      ACCESS_OWNER_EMAIL: ${{ vars.ACCESS_OWNER_EMAIL }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      # Telegram (M5): on once the lane's Environment has the bot token. The allowlist and bot username are variables.
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
      TELEGRAM_ALLOWED_USER_IDS: ${{ vars.TELEGRAM_ALLOWED_USER_IDS }}
      TELEGRAM_BOT_USERNAME: ${{ vars.TELEGRAM_BOT_USERNAME }}
      # PiDu relay (M7): on once the lane's Environment has RELAY_TOKEN. RELAY_TOKEN_PREVIOUS only while rotating it.
      RELAY_TOKEN: ${{ secrets.RELAY_TOKEN }}
      RELAY_TOKEN_PREVIOUS: ${{ secrets.RELAY_TOKEN_PREVIOUS }}
      # Spend cap and pause (M9): an Environment variable overrides wrangler.jsonc's value for that lane. MIPI_PAUSED=1
      # holds every model call until a deploy without it.
      MIPI_DAILY_SPEND_CAP: ${{ vars.MIPI_DAILY_SPEND_CAP }}
      MIPI_PAUSED: ${{ vars.MIPI_PAUSED }}
      # Provider usage readout (M9), optional: a key with usage permission when the model key has none, and the
      # OpenCode workspace id if Go asks for one.
      OPENCODE_USAGE_KEY: ${{ secrets.OPENCODE_USAGE_KEY }}
      OPENCODE_ORG_ID: ${{ vars.OPENCODE_ORG_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Require the deploy secrets
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          MIPI_SPIKE_TOKEN: ${{ secrets.MIPI_SPIKE_TOKEN }}
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID OPENCODE_API_KEY MIPI_SPIKE_TOKEN ADMIN_TOKEN; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing (Settings → Environments → $TARGET, or repository secrets)"
            exit 1
          fi
          if [ -n "$ACCESS_TEAM_DOMAIN$ACCESS_AUD" ]; then
            for name in ACCESS_TEAM_DOMAIN ACCESS_AUD ACCESS_OWNER_EMAIL CF_ACCESS_CLIENT_ID CF_ACCESS_CLIENT_SECRET; do
              if [ -z "${!name}" ]; then
                echo "::error::Access is half set up: $name is missing (Environment $TARGET: variables ACCESS_TEAM_DOMAIN, ACCESS_AUD, ACCESS_OWNER_EMAIL; secrets CF_ACCESS_CLIENT_ID, CF_ACCESS_CLIENT_SECRET)"
                exit 1
              fi
            done
          fi
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            for name in TELEGRAM_WEBHOOK_SECRET TELEGRAM_ALLOWED_USER_IDS TELEGRAM_BOT_USERNAME; do
              if [ -z "${!name}" ]; then
                echo "::error::Telegram is half set up: $name is missing (Environment $TARGET: secrets TELEGRAM_BOT_TOKEN, TELEGRAM_WEBHOOK_SECRET; variables TELEGRAM_ALLOWED_USER_IDS, TELEGRAM_BOT_USERNAME)"
                exit 1
              fi
            done
            if ! [[ "$TELEGRAM_WEBHOOK_SECRET" =~ ^[A-Za-z0-9_-]{32,256}$ ]]; then
              echo "::error::TELEGRAM_WEBHOOK_SECRET must be 32–256 of A–Z, a–z, 0–9, _ and -"
              exit 1
            fi
          fi
          if [ -z "$RELAY_TOKEN" ] && [ -n "$RELAY_TOKEN_PREVIOUS" ]; then
            echo "::error::RELAY_TOKEN_PREVIOUS is set without RELAY_TOKEN (Environment $TARGET); the relay would stay off"
            exit 1
          fi
          relay_names=""
          if [ -n "$RELAY_TOKEN" ]; then relay_names="RELAY_TOKEN"; fi
          if [ -n "$RELAY_TOKEN_PREVIOUS" ]; then relay_names="$relay_names RELAY_TOKEN_PREVIOUS"; fi
          for name in MIPI_SPIKE_TOKEN ADMIN_TOKEN $relay_names; do
            value="${!name}"
            if [ "${#value}" -lt 24 ]; then
              echo "::error::$name is shorter than 24 characters; use a long random string"
              exit 1
            fi
          done

      - name: Worker URL
        run: |
          subdomain="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r .result.subdomain)"
          name="mipi"; [ "$TARGET" = staging ] && name="mipi-staging"
          echo "WORKER_URL=https://$name.$subdomain.workers.dev" >> "$GITHUB_ENV"

      - name: Back up the agent
        run: node scripts/deploy.ts backup --url "$WORKER_URL" --out "$RUNNER_TEMP/backup.json"
      - uses: actions/upload-artifact@v7
        with:
          name: backup-${{ env.TARGET }}-${{ github.run_id }}
          path: ${{ runner.temp }}/backup.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Build
        run: |
          if [ "$TARGET" = staging ]; then export CLOUDFLARE_ENV=staging; fi
          pnpm build

      - name: Deploy with secrets
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          MIPI_SPIKE_TOKEN: ${{ secrets.MIPI_SPIKE_TOKEN }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          secrets="$RUNNER_TEMP/worker-secrets.json"
          trap 'rm -f "$secrets"' EXIT
          umask 077
          jq -n --arg key "$OPENCODE_API_KEY" --arg spike "$MIPI_SPIKE_TOKEN" --arg admin "$ADMIN_TOKEN" \
            --arg bot "$TELEGRAM_BOT_TOKEN" --arg hook "$TELEGRAM_WEBHOOK_SECRET" \
            --arg relay "$RELAY_TOKEN" --arg relay_previous "$RELAY_TOKEN_PREVIOUS" \
            --arg usage_key "$OPENCODE_USAGE_KEY" \
            '{OPENCODE_API_KEY: $key, MIPI_SPIKE_TOKEN: $spike, ADMIN_TOKEN: $admin}
              + (if $bot == "" then {} else {TELEGRAM_BOT_TOKEN: $bot, TELEGRAM_WEBHOOK_SECRET: $hook} end)
              + {OPENCODE_USAGE_KEY: (if $usage_key == "" then "off" else $usage_key end)}
              + {RELAY_TOKEN: (if $relay == "" then "off" else $relay end),
                 RELAY_TOKEN_PREVIOUS: (if $relay_previous == "" then "off" else $relay_previous end)}' > "$secrets"
          # Secrets ship with the version itself, so no deployed version ever runs without its key.
          # --secrets-file only adds: a secret left out keeps its old value. So both relay tokens are always written, and
          # an unset one as "off", which is under 24 characters and accepted by nothing: removing RELAY_TOKEN turns the
          # relay off, and removing RELAY_TOKEN_PREVIOUS after a rotation stops the old token working. OPENCODE_USAGE_KEY
          # is written the same way, so removing it stops the readout using it.
          # Access settings ride with the version as vars (they're not secret); unset, Access stays off.
          access_vars=()
          if [ -n "$ACCESS_TEAM_DOMAIN" ] && [ -n "$ACCESS_AUD" ]; then
            access_vars=(--var "ACCESS_TEAM_DOMAIN:$ACCESS_TEAM_DOMAIN" --var "ACCESS_AUD:$ACCESS_AUD" --var "ACCESS_OWNER_EMAIL:$ACCESS_OWNER_EMAIL" \
              --var "ACCESS_SERVICE_CLIENT_ID:$CF_ACCESS_CLIENT_ID")
          fi
          telegram_vars=()
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            telegram_vars=(--var "TELEGRAM_ALLOWED_USER_IDS:$TELEGRAM_ALLOWED_USER_IDS" --var "TELEGRAM_BOT_USERNAME:$TELEGRAM_BOT_USERNAME")
          fi
          # The spend cap, pause and Go workspace ride as vars too, only when the Environment sets them.
          ops_vars=()
          if [ -n "$MIPI_DAILY_SPEND_CAP" ]; then ops_vars+=(--var "MIPI_DAILY_SPEND_CAP:$MIPI_DAILY_SPEND_CAP"); fi
          if [ -n "$MIPI_PAUSED" ]; then ops_vars+=(--var "MIPI_PAUSED:$MIPI_PAUSED"); fi
          if [ -n "$OPENCODE_ORG_ID" ]; then ops_vars+=(--var "OPENCODE_ORG_ID:$OPENCODE_ORG_ID"); fi
          pnpm exec wrangler deploy --secrets-file "$secrets" "${access_vars[@]}" "${telegram_vars[@]}" "${ops_vars[@]}" \
            --message "$version (${GITHUB_SHA::7})" --tag "$version"

      - name: Health check
        # The deployed version, read through the admin API (with Access on, the public health check shows no version).
        run: |
          expected="$(node -p 'require("./package.json").version')"
          deployed=""
          for attempt in 1 2 3 4 5 6; do
            deployed="$(node scripts/deploy.ts version --url "$WORKER_URL" 2>/dev/null || true)"
            if [ "$deployed" = "$expected" ]; then
              echo "Healthy: $WORKER_URL runs $deployed"
              echo "### Deployed MiPi $expected to $TARGET: $WORKER_URL" >> "$GITHUB_STEP_SUMMARY"
              node scripts/deploy.ts status --url "$WORKER_URL" | jq '{state, build, rows}' >> "$GITHUB_STEP_SUMMARY" || true
              exit 0
            fi
            sleep 10
          done
          echo "::error::$WORKER_URL did not report version $expected through the admin API (last: ${deployed:-no answer})"
          exit 1

      - name: Register the Telegram webhook
        if: env.TELEGRAM_BOT_TOKEN != ''
        # Idempotent: points the lane's bot at this Worker, for new messages only.
        run: node scripts/telegram-webhook.ts --url "$WORKER_URL/api/telegram"
