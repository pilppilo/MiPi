name: deploy

# Deploys main to the `mipi` Worker after `check` passes on it, or on demand.
on:
  workflow_run:
    workflows: [check]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Require the deploy secrets
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          MIPI_SPIKE_TOKEN: ${{ secrets.MIPI_SPIKE_TOKEN }}
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID OPENCODE_API_KEY MIPI_SPIKE_TOKEN; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          if [ "${#MIPI_SPIKE_TOKEN}" -lt 24 ]; then
            echo "::error::MIPI_SPIKE_TOKEN is shorter than 24 characters; use a long random string"
            exit 1
          fi

      - name: Build
        run: pnpm build

      - name: Deploy with secrets
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          MIPI_SPIKE_TOKEN: ${{ secrets.MIPI_SPIKE_TOKEN }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          secrets="$RUNNER_TEMP/worker-secrets.json"
          trap 'rm -f "$secrets"' EXIT
          umask 077
          jq -n --arg key "$OPENCODE_API_KEY" --arg token "$MIPI_SPIKE_TOKEN" \
            '{OPENCODE_API_KEY: $key, MIPI_SPIKE_TOKEN: $token}' > "$secrets"
          # Secrets ship with the version itself, so no deployed version ever runs without its key.
          pnpm exec wrangler deploy --secrets-file "$secrets" \
            --message "$version (${GITHUB_SHA::7})" --tag "$version"

      - name: Health check
        run: |
          subdomain="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r .result.subdomain)"
          url="https://mipi.$subdomain.workers.dev"
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS "$url/api/health" | grep -q '"ok":true'; then
              echo "Healthy: $url"
              echo "### Deployed to $url" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$url/api/health did not answer {\"ok\":true}"
          exit 1
